<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>음성 → 텍스트 → 실시간 번역</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Malgun Gothic", sans-serif;
    margin: 0; padding: 24px; background: #f5f6f8; color: #1b1c1e;
    display: flex; justify-content: center;
  }
  .wrap { width: 100%; max-width: 980px; }
  h1 { font-size: 20px; margin: 0 0 16px; }
  .panel {
    background: #fff; border: 1px solid #e3e5e8; border-radius: 12px;
    padding: 20px; margin-bottom: 16px;
  }
  .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  button {
    font-size: 15px; padding: 10px 18px; border-radius: 8px;
    border: 1px solid #d0d3d8; background: #fff; cursor: pointer;
  }
  button:hover:not(:disabled) { background: #f0f1f3; }
  button:disabled { opacity: .45; cursor: not-allowed; }
  #startBtn { background: #1f6feb; border-color: #1f6feb; color: #fff; }
  #startBtn:hover:not(:disabled) { background: #1a5fd0; }
  #stopBtn { background: #d73a49; border-color: #d73a49; color: #fff; }
  #stopBtn:hover:not(:disabled) { background: #bc3240; }
  select { font-size: 15px; padding: 9px 10px; border-radius: 8px; border: 1px solid #d0d3d8; }
  label.chk { font-size: 14px; display: flex; align-items: center; gap: 6px; }
  #status, #trStatus {
    margin-top: 14px; font-size: 14px; color: #5a5f66;
    display: flex; align-items: center; gap: 8px;
  }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: #b5b9bf; flex: none; }
  .dot.live { background: #d73a49; animation: pulse 1.1s infinite; }
  .dot.ok { background: #2da44e; }
  .dot.warn { background: #e3a008; }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .25; } }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  @media (max-width: 760px) { .grid { grid-template-columns: 1fr; } }
  .box h2 { font-size: 14px; margin: 0 0 8px; color: #5a5f66; font-weight: 600; }
  textarea {
    min-height: 260px; width: 100%; font-size: 16px; line-height: 1.7;
    padding: 14px; border: 1px solid #e3e5e8; border-radius: 8px;
    resize: vertical; font-family: inherit; background: #fcfcfd;
  }
  #translated { background: #f7faff; }
  .meter { height: 8px; background: #e9ebee; border-radius: 4px; overflow: hidden; margin-top: 12px; }
  .meter > div { height: 100%; width: 0%; background: #1f6feb; transition: width .08s linear; }
  .bar { height: 6px; background: #e9ebee; border-radius: 3px; overflow: hidden; margin-top: 8px; display: none; }
  .bar > div { height: 100%; width: 0%; background: #2da44e; transition: width .2s; }
  .note { font-size: 13px; color: #6b7076; line-height: 1.7; }
  code { background: #eef0f2; padding: 1px 5px; border-radius: 4px; font-size: 12px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>마이크 음성 → 텍스트 → 실시간 번역</h1>

  <div class="panel">
    <div class="row">
      <button id="startBtn">● 녹음 시작</button>
      <button id="stopBtn" disabled>■ 중지</button>
      <select id="lang" title="인식 언어">
        <option value="ko-KR" selected>인식: 한국어</option>
        <option value="en-US">인식: English</option>
        <option value="ja-JP">인식: 日本語</option>
        <option value="zh-CN">인식: 中文</option>
        <option value="es-ES">인식: Español</option>
      </select>
      <span>→</span>
      <select id="target" title="번역 대상 언어">
        <option value="en" selected>번역: English</option>
        <option value="ko">번역: 한국어</option>
        <option value="ja">번역: 日本語</option>
        <option value="zh">번역: 中文</option>
        <option value="es">번역: Español</option>
        <option value="fr">번역: Français</option>
        <option value="de">번역: Deutsch</option>
      </select>
      <label class="chk"><input type="checkbox" id="autoTr" checked> 자동 번역</label>
      <label class="chk"><input type="checkbox" id="speakChk"> 번역문 읽기</label>
      <label class="chk"><input type="checkbox" id="continuous" checked> 연속 인식</label>
      <button id="trBtn">전체 번역</button>
      <button id="clearBtn">지우기</button>
    </div>

    <div class="meter"><div id="level"></div></div>
    <div id="status"><span class="dot" id="dot"></span><span id="statusText">대기 중</span></div>
    <div id="trStatus"><span class="dot" id="trDot"></span><span id="trStatusText">번역기 확인 중...</span></div>
    <div class="bar" id="dlBar"><div id="dlFill"></div></div>
  </div>

  <div class="panel grid">
    <div class="box">
      <h2>원문 (음성 인식)</h2>
      <textarea id="output" placeholder="인식된 텍스트가 여기에 표시됩니다."></textarea>
    </div>
    <div class="box">
      <h2>번역문</h2>
      <textarea id="translated" placeholder="번역 결과가 여기에 표시됩니다." readonly></textarea>
    </div>
  </div>

  <div class="panel note">
    <strong>동작 조건</strong><br>
    · 음성 인식: <code>SpeechRecognition</code> — Chrome / Edge / Safari.<br>
    · 번역: <code>Translator</code> (Chrome 138+ 내장 AI, 기기 내 번역 모델). 최초 1회 모델 다운로드가 진행됩니다.<br>
    · 미지원 브라우저에서는 음성 인식만 동작하고 번역 영역에 안내가 표시됩니다.<br>
    · 마이크 권한 필요, <code>https://</code> 또는 <code>localhost</code> 에서만 작동합니다.
  </div>
</div>

<script>
(function () {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  const $ = id => document.getElementById(id);
  const startBtn = $('startBtn'), stopBtn = $('stopBtn');
  const output = $('output'), translated = $('translated');
  const langSel = $('lang'), targetSel = $('target');
  const contChk = $('continuous'), autoTr = $('autoTr'), speakChk = $('speakChk');
  const statusText = $('statusText'), dot = $('dot');
  const trStatusText = $('trStatusText'), trDot = $('trDot');
  const level = $('level'), dlBar = $('dlBar'), dlFill = $('dlFill');

  let recognition = null, manualStop = false, finalText = '';
  let audioCtx, analyser, micStream, rafId;
  let translator = null, trKey = '', trQueue = Promise.resolve();

  const setStatus = (m, live) => { statusText.textContent = m; dot.classList.toggle('live', !!live); };
  const setTr = (m, cls) => {
    trStatusText.textContent = m;
    trDot.className = 'dot' + (cls ? ' ' + cls : '');
  };

  /* ---------- 1. 음성 인식 ---------- */
  if (!SR) {
    setStatus('이 브라우저는 음성 인식을 지원하지 않습니다 (Chrome/Edge 권장)');
    startBtn.disabled = true;
  }

  const render = interim => {
    output.value = finalText + (interim || '');
    output.scrollTop = output.scrollHeight;
  };

  async function startMeter() {
    try {
      micStream = await navigator.mediaDevices.getUserMedia({ audio: true });
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      analyser = audioCtx.createAnalyser();
      analyser.fftSize = 512;
      audioCtx.createMediaStreamSource(micStream).connect(analyser);
      const data = new Uint8Array(analyser.frequencyBinCount);
      const loop = () => {
        analyser.getByteTimeDomainData(data);
        let sum = 0;
        for (let i = 0; i < data.length; i++) { const v = (data[i] - 128) / 128; sum += v * v; }
        level.style.width = Math.min(100, Math.sqrt(sum / data.length) * 320) + '%';
        rafId = requestAnimationFrame(loop);
      };
      loop();
    } catch (e) {}
  }

  function stopMeter() {
    if (rafId) cancelAnimationFrame(rafId);
    if (micStream) micStream.getTracks().forEach(t => t.stop());
    if (audioCtx) audioCtx.close();
    audioCtx = micStream = analyser = null;
    level.style.width = '0%';
  }

  function createRecognition() {
    const r = new SR();
    r.lang = langSel.value;
    r.continuous = contChk.checked;
    r.interimResults = true;
    r.maxAlternatives = 1;

    r.onstart = () => { setStatus('듣는 중...', true); startBtn.disabled = true; stopBtn.disabled = false; };

    r.onresult = e => {
      let interim = '';
      for (let i = e.resultIndex; i < e.results.length; i++) {
        const txt = e.results[i][0].transcript;
        if (e.results[i].isFinal) {
          const s = txt.trim();
          finalText += s + ' ';
          if (autoTr.checked && s) enqueueTranslate(s);   // 문장 확정 시점마다 번역
        } else interim += txt;
      }
      render(interim);
    };

    r.onerror = e => {
      if (e.error === 'no-speech') { setStatus('음성이 감지되지 않음, 계속 대기 중', true); return; }
      if (e.error === 'not-allowed' || e.error === 'service-not-allowed') {
        manualStop = true; setStatus('마이크 권한이 거부되었습니다');
      } else setStatus('오류: ' + e.error);
    };

    r.onend = () => {
      if (!manualStop && contChk.checked) { try { r.start(); return; } catch (_) {} }
      startBtn.disabled = false; stopBtn.disabled = true;
      stopMeter(); setStatus('중지됨');
    };
    return r;
  }

  /* ---------- 2. 기기 내 번역기 ---------- */
  const baseLang = () => langSel.value.split('-')[0];

  async function ensureTranslator() {
    if (!('Translator' in self)) { setTr('이 브라우저는 내장 번역을 지원하지 않습니다 (Chrome 138+ 필요)', 'warn'); return null; }
    const src = baseLang(), tgt = targetSel.value;
    if (src === tgt) { setTr('원문과 번역 언어가 같습니다', 'warn'); return null; }

    const key = src + '>' + tgt;
    if (translator && trKey === key) return translator;

    if (translator) { try { translator.destroy(); } catch (_) {} translator = null; }

    try {
      const avail = await Translator.availability({ sourceLanguage: src, targetLanguage: tgt });
      if (avail === 'unavailable') { setTr(`${key} 조합은 지원되지 않습니다`, 'warn'); return null; }

      setTr(avail === 'available' ? `번역기 준비 중 (${key})` : `번역 모델 다운로드 중 (${key})`);
      if (avail !== 'available') dlBar.style.display = 'block';

      translator = await Translator.create({
        sourceLanguage: src,
        targetLanguage: tgt,
        monitor(m) {
          m.addEventListener('downloadprogress', e => {
            const pct = Math.round((e.loaded || 0) * 100);
            dlFill.style.width = pct + '%';
            setTr(`번역 모델 다운로드 중... ${pct}%`);
          });
        }
      });
      trKey = key;
      dlBar.style.display = 'none';
      setTr(`번역 준비 완료 (${key})`, 'ok');
      return translator;
    } catch (e) {
      dlBar.style.display = 'none';
      setTr('번역기 초기화 실패: ' + e.message, 'warn');
      return null;
    }
  }

  // 순차 큐 — 동시 호출로 순서가 뒤섞이는 것 방지
  function enqueueTranslate(text) {
    trQueue = trQueue.then(async () => {
      const t = await ensureTranslator();
      if (!t) return;
      try {
        const out = await t.translate(text);
        translated.value += out.trim() + ' ';
        translated.scrollTop = translated.scrollHeight;
        if (speakChk.checked) speak(out, targetSel.value);
      } catch (e) {
        setTr('번역 오류: ' + e.message, 'warn');
      }
    }).catch(() => {});
    return trQueue;
  }

  function speak(text, lang) {
    if (!('speechSynthesis' in window)) return;
    const u = new SpeechSynthesisUtterance(text);
    u.lang = { en: 'en-US', ko: 'ko-KR', ja: 'ja-JP', zh: 'zh-CN', es: 'es-ES', fr: 'fr-FR', de: 'de-DE' }[lang] || lang;
    speechSynthesis.speak(u);
  }

  /* ---------- 3. 이벤트 ---------- */
  startBtn.addEventListener('click', () => {
    manualStop = false;
    finalText = output.value ? output.value.replace(/\s*$/, ' ') : '';
    recognition = createRecognition();
    startMeter();
    ensureTranslator();
    try { recognition.start(); } catch (e) { setStatus('시작 실패: ' + e.message); }
  });

  stopBtn.addEventListener('click', () => { manualStop = true; if (recognition) recognition.stop(); });

  langSel.addEventListener('change', () => {
    ensureTranslator();
    if (recognition && !stopBtn.disabled) {
      manualStop = true; recognition.stop();
      setTimeout(() => startBtn.click(), 250);
    }
  });

  targetSel.addEventListener('change', () => { translated.value = ''; ensureTranslator(); });

  $('trBtn').addEventListener('click', () => {
    const text = output.value.trim();
    if (!text) return;
    translated.value = '';
    enqueueTranslate(text);
  });

  $('clearBtn').addEventListener('click', () => {
    finalText = ''; output.value = ''; translated.value = '';
  });

  ensureTranslator();
})();
</script>
</body>
</html>
